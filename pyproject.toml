# SAMA package configuration (PEP 517/518/621).
# setup.py is kept only for compatibility with older tools.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samapy"
version = "1.0.6"
description = "SAMAPy - Solar Alone Multi-objective Advisor for Hybrid Renewable Energy Systems Python Package"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Seyyed Ali Sadat", email = "alisadat942@gmail.com" }
]
requires-python = ">=3.9"

keywords = [
    "renewable energy", "optimization", "microgrid", "hybrid energy",
    "solar PV", "wind", "battery", "electric vehicle", "heat pump",
    "HOMER", "energy storage", "photovoltaic", "diesel generator"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Minimum supported versions. requirements.txt pins the versions used in development.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "numba>=0.57",
    "matplotlib>=3.6",
    "openpyxl>=3.0",
    "seaborn>=0.12",
    "numpy-financial>=1.0.0",
    "questionary>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
samapy-config = "samapy.cli.wizard:main"
samapy-run    = "samapy.cli.runner:main"

[project.urls]
Homepage          = "https://github.com/Sas1997/SAMA"
Repository        = "https://github.com/Sas1997/SAMA"
Issues            = "https://github.com/Sas1997/SAMA/issues"
Documentation     = "https://github.com/Sas1997/SAMA/blob/main/Docs/SAMA_Documentation.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
samapy = [
    "content/*",
    "content/**/*",
    "cli/samapy_Wizard.py",
]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"
