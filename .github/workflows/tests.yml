name: Tests

# Runs the test suite on every push to main and on every pull request.
# The slow tests (full SAMA runs with result generation) can be started by
# hand from the Actions tab with "Run workflow".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SAMA and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest

  slow-tests:
    name: Slow tests (full SAMA runs)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SAMA and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run slow tests
        run: python -m pytest -m slow
